query DefaultBranch($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    defaultBranchRef {
      name
      target {
        ... on Commit {
          oid
        }
      }
    }
    latestRelease {
      tagName
      name
      description
      createdAt
      url
    }
  }
}

query FileIfExists($owner: String!, $name: String!, $expr: String!) {
  repository(owner: $owner, name: $name) {
    object(expression: $expr) {
      __typename
      ... on Blob {
        oid
        byteSize
        text
      }
    }
  }
}